<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro-Utility Hub - Developer & Creator Suite</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN (UMD bundle) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- PDF-Lib CDN for Client-Side PDF Operations -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- @imgly/background-removal CDN for Browser-Side AI Background Removal -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/imgly-background-removal.umd.js"></script>
  <!-- QRCode CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- JsBarcode CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }
    /* Checkerboard background for transparency preview */
    .bg-checkerboard {
      background-color: #121212;
      background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
                         linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
                         linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
                         linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .swatch-card {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
    }
    .swatch-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
  <!-- Toast Notifications Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
  
  <!-- Main Top Bar / Header -->
  <header class="bg-[#0f0f0f] border-b border-white/5 sticky top-0 z-30 shadow-xl backdrop-blur-md bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <!-- App Logo & Title -->
        <div class="flex items-center gap-3 shrink-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-600/20">
            <i data-lucide="layers" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-bold text-base tracking-tight text-white leading-none">Micro-Utility Hub</h1>
              <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Pro</span>
            </div>
            <p class="text-[11px] text-gray-400 hidden sm:block mt-0.5">100% Client-Side & Private Micro Tools</p>
          </div>
        </div>
        <!-- Master Status Badge -->
        <div class="hidden lg:flex items-center gap-4 text-xs text-gray-400">
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-gray-300 font-medium">Zero Uploads • Instant Browser Processing</span>
          </div>
        </div>
      </div>
      
      <!-- Horizontal Navigation Bar -->
      <nav class="flex items-center gap-2 py-2.5 overflow-x-auto no-scrollbar border-t border-white/5 scroll-smooth">
        <button onclick="switchTab('focus')" id="tab-btn-focus" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 shadow-md shadow-indigo-500/10">
          <i data-lucide="headphones" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Focus Studio</span>
          <span id="focus-active-dot" class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
        </button>
        <button onclick="switchTab('text')" id="tab-btn-text" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="file-text" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Text Cleaner</span>
        </button>
        <button onclick="switchTab('color')" id="tab-btn-color" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="palette" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Color Palette</span>
        </button>
        <button onclick="switchTab('mockup')" id="tab-btn-mockup" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="monitor" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Screenshot Mockup</span>
        </button>
        <button onclick="switchTab('bgremove')" id="tab-btn-bgremove" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="wand-2" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Background Remover</span>
        </button>
        <button onclick="switchTab('readtime')" id="tab-btn-readtime" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="clock" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Reading & Speaking</span>
        </button>
        <button onclick="switchTab('aspect')" id="tab-btn-aspect" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="crop" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Aspect & Scaler</span>
        </button>
        <button onclick="switchTab('svg')" id="tab-btn-svg" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="code-2" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>SVG to CSS/URI</span>
        </button>
        <button onclick="switchTab('aidesign')" id="tab-btn-aidesign" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="sparkles" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>AI Design Utils</span>
        </button>
        <button onclick="switchTab('qr')" id="tab-btn-qr" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="qr-code" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>QR & Barcode Gen</span>
        </button>
        <button onclick="switchTab('pdf')" id="tab-btn-pdf" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="file-stack" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>PDF Hub</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <!-- TAB 1: FOCUS STUDIO -->
    <section id="section-focus" class="tab-content space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-7 bg-[#141414] border border-white/5 rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
          <div class="flex items-center gap-2 p-1 bg-[#0a0a0a] border border-white/10 rounded-xl mb-6">
            <button onclick="setTimerMode('work')" id="mode-work" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm">Focus (25m)</button>
            <button onclick="setTimerMode('short')" id="mode-short" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition">Short Break (5m)</button>
            <button onclick="setTimerMode('long')" id="mode-long" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition">Long Break (15m)</button>
          </div>
          <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
            <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" class="text-white/5" fill="transparent" />
              <circle id="timer-progress-ring" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" class="text-indigo-500 transition-all duration-1000 ease-linear" stroke-linecap="round" fill="transparent" stroke-dasharray="276.46" stroke-dashoffset="0" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span id="timer-display" class="font-mono text-5xl sm:text-6xl font-bold tracking-tight text-white">25:00</span>
              <span id="timer-label" class="text-xs uppercase tracking-widest text-indigo-400 mt-2 font-semibold">Deep Work Interval</span>
            </div>
          </div>
          <div class="flex items-center gap-4 mt-6">
            <button onclick="resetTimer()" title="Reset Timer" class="p-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white transition border border-white/10">
              <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>
            <button onclick="toggleTimer()" id="timer-play-btn" class="px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-indigo-600/25 flex items-center gap-2">
              <i id="timer-play-icon" data-lucide="play" class="w-5 h-5 fill-current"></i>
              <span id="timer-play-text">Start Focus Session</span>
            </button>
            <button onclick="skipTimerMode()" title="Skip Mode" class="p-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white transition border border-white/10">
              <i data-lucide="skip-forward" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <div class="lg:col-span-5 space-y-6 flex flex-col justify-between">
          <div class="bg-[#141414] border border-white/5 rounded-2xl p-6 shadow-xl space-y-4">
            <h3 class="text-sm font-semibold text-white flex items-center gap-2">
              <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
              <span>Instant Soundscape Presets</span>
            </h3>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="applyAudioPreset('rainy')" class="p-3 rounded-xl bg-[#0a0a0a] hover:bg-white/5 border border-white/5 text-left transition group">
                <div class="text-xs font-semibold text-gray-200 group-hover:text-indigo-400">🌧️ Heavy Rain</div>
                <div class="text-[11px] text-gray-500 mt-1">Rain + White Noise</div>
              </button>
              <button onclick="applyAudioPreset('cafe')" class="p-3 rounded-xl bg-[#0a0a0a] hover:bg-white/5 border border-white/5 text-left transition group">
                <div class="text-xs font-semibold text-gray-200 group-hover:text-indigo-400">☕ Cozy Cafe</div>
                <div class="text-[11px] text-gray-500 mt-1">Coffee Shop + Rain</div>
              </button>
              <button onclick="applyAudioPreset('forest')" class="p-3 rounded-xl bg-[#0a0a0a] hover:bg-white/5 border border-white/5 text-left transition group">
                <div class="text-xs font-semibold text-gray-200 group-hover:text-indigo-400">🌲 Deep Forest</div>
                <div class="text-[11px] text-gray-500 mt-1">Birds + Breeze</div>
              </button>
              <button onclick="applyAudioPreset('zen')" class="p-3 rounded-xl bg-[#0a0a0a] hover:bg-white/5 border border-white/5 text-left transition group">
                <div class="text-xs font-semibold text-gray-200 group-hover:text-indigo-400">🧘 Pure Focus</div>
                <div class="text-[11px] text-gray-500 mt-1">White Noise Spectrum</div>
              </button>
            </div>
            <button onclick="stopAllSounds()" class="w-full py-2.5 text-xs font-medium text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl transition flex items-center justify-center gap-1.5">
              <i data-lucide="square" class="w-3.5 h-3.5"></i>
              <span>Stop All Audio</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Additional sections from Hub can be appended or copied directly from the loaded data structure[span_2](start_span)[span_2](end_span). -->
  </main>

  <script>
    // App Logic Controller[span_3](start_span)[span_3](end_span)
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(`section-${tabId}`);
      if (target) target.classList.remove('hidden');
    }
  </script>
</body>
</html>
