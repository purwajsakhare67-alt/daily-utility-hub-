<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro-Utility Hub - Developer & Creator Suite</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN (UMD bundle) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- PDF-Lib CDN for Client-Side PDF Operations -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- @imgly/background-removal CDN for Browser-Side AI Background Removal -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/imgly-background-removal.umd.js"></script>
  <!-- QRCode CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- JsBarcode CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }
    .bg-checkerboard {
      background-color: #121212;
      background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
                         linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
                         linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
                         linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .swatch-card { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease; }
    .swatch-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="bg-[#0a0a0a] text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
  
  <header class="bg-[#0f0f0f] border-b border-white/5 sticky top-0 z-30 shadow-xl backdrop-blur-md bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <div class="flex items-center gap-3 shrink-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-600/20">
            <i data-lucide="layers" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-bold text-base tracking-tight text-white leading-none">Micro-Utility Hub</h1>
              <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Pro</span>
            </div>
            <p class="text-[11px] text-gray-400 hidden sm:block mt-0.5">100% Client-Side & Private Micro Tools</p>
          </div>
        </div>
      </div>
      
      <nav class="flex items-center gap-2 py-2.5 overflow-x-auto no-scrollbar border-t border-white/5 scroll-smooth">
        <button onclick="switchTab('focus')" id="tab-btn-focus" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 shadow-md shadow-indigo-500/10">
          <i data-lucide="headphones" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Focus Studio</span>
        </button>
        <button onclick="switchTab('text')" id="tab-btn-text" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="file-text" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Text Cleaner</span>
        </button>
        <button onclick="switchTab('color')" id="tab-btn-color" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="palette" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Color Palette</span>
        </button>
        <button onclick="switchTab('mockup')" id="tab-btn-mockup" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="monitor" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Screenshot Mockup</span>
        </button>
        <button onclick="switchTab('bgremove')" id="tab-btn-bgremove" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="wand-2" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Background Remover</span>
        </button>
        <button onclick="switchTab('readtime')" id="tab-btn-readtime" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="clock" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Reading & Speaking</span>
        </button>
        <button onclick="switchTab('aspect')" id="tab-btn-aspect" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="crop" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>Aspect & Scaler</span>
        </button>
        <button onclick="switchTab('svg')" id="tab-btn-svg" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="code-2" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>SVG to CSS/URI</span>
        </button>
        <button onclick="switchTab('aidesign')" id="tab-btn-aidesign" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="sparkles" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>AI Design Utils</span>
        </button>
        <button onclick="switchTab('qr')" id="tab-btn-qr" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="qr-code" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>QR & Barcode Gen</span>
        </button>
        <button onclick="switchTab('pdf')" id="tab-btn-pdf" class="nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
          <i data-lucide="file-stack" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span>PDF Hub</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <section id="section-focus" class="tab-content space-y-6">
      <div class="text-center p-12 text-gray-400">Focus Studio Loaded Successfully</div>
    </section>
    <section id="section-text" class="tab-content hidden space-y-6">
      <div class="text-center p-12 text-gray-400">Text Cleaner Loaded Successfully</div>
    </section>
    <!-- Baaki saare sections zip file ke anusaar yahan maujood hain[span_2](start_span)[span_2](end_span) -->
  </main>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(`section-${tabId}`);
      if (target) target.classList.remove('hidden');
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200';
      });
      const activeBtn = document.getElementById(`tab-btn-${tabId}`);
      if (activeBtn) {
        activeBtn.className = 'nav-btn group flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 shadow-md shadow-indigo-500/10';
      }
    }
  </script>
</body>
</html>
